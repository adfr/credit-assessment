name: Credit Risk Assessment Platform
description: |
  End-to-end credit risk approval and monitoring platform featuring:
  - ML models for Probability of Default (PD) and Loss Given Default (LGD)
  - LangGraph agentic workflow with human-in-the-loop
  - React/Next.js frontend with workflow visualization
  - AI analyst workbench with RAG
  - Real-time monitoring and drift detection

author: Credit Risk Team
specification_version: 1
prototype_version: 1.0.0
date: "2024-01-15"

environment_variables:
  ANTHROPIC_API_KEY:
    default: ""
    description: "API key for Claude AI services (required for LLM features)"
    required: true
  SERPER_API_KEY:
    default: ""
    description: "API key for Serper news search (get from https://serper.dev)"
    required: true
  FINANCIAL_DATASETS_API_KEY:
    default: ""
    description: "API key for 10-K filings (get from https://financialdatasets.ai)"
    required: true
  APP_ENV:
    default: "production"
    description: "Application environment (local or production)"
  LOG_LEVEL:
    default: "INFO"
    description: "Logging level (DEBUG, INFO, WARNING, ERROR)"
  DATABASE_URL:
    default: "sqlite:////home/cdsw/data/credit_risk.db"
    description: "Database connection URL (SQLite or PostgreSQL)"
  DATABASE_PATH:
    default: "/home/cdsw/data/credit_risk.db"
    description: "Path to SQLite database file"
  CHROMA_PERSIST_DIRECTORY:
    default: "/home/cdsw/data/chroma_db"
    description: "Path to ChromaDB vector store"
  VECTOR_STORE_PATH:
    default: "/home/cdsw/data/vector_store"
    description: "Path to vector store directory"
  REDIS_URL:
    default: ""
    description: "Redis connection URL (optional, for workflow state)"
  MLFLOW_TRACKING_URI:
    default: "/home/cdsw/mlruns"
    description: "MLflow tracking server URI (local path or https URL)"
  MLFLOW_EXPERIMENT_NAME:
    default: "credit_risk_production"
    description: "MLflow experiment name for model tracking"
  CML_DEPLOYMENT_MODE:
    default: "local"
    description: "Deployment mode: local (use model files) or cml (use CML endpoints)"
  SPARK_WAREHOUSE_DIR:
    default: ""
    description: "S3/ADLS warehouse path for Iceberg tables (e.g., s3a://bucket/warehouse/credit_risk)"
    required: false
  SPARK_ICEBERG_DATABASE:
    default: "credit_risk"
    description: "Iceberg database name for storing tables"
  SPARK_ICEBERG_CATALOG:
    default: "spark_catalog"
    description: "Iceberg catalog name (usually spark_catalog for CDP)"
  DATA_STORAGE_MODE:
    default: "local"
    description: "Data storage mode: local (SQLite) or iceberg (Spark/Iceberg tables)"
  CDE_API_URL:
    default: ""
    description: "CDE API URL (e.g., https://xxxxxx.cde-xxxx.cdp.cloudera.com/dex/api/v1)"
    required: false
  CDE_VIRTUAL_CLUSTER:
    default: ""
    description: "CDE Virtual Cluster name for running Spark jobs"
    required: false
  CDP_ACCESS_KEY_ID:
    default: ""
    description: "CDP Access Key ID for CDE authentication (from CDP User Management)"
    required: false
  CDP_PRIVATE_KEY:
    default: ""
    description: "CDP Private Key for CDE authentication (from CDP User Management)"
    required: false
  CDE_RESOURCE_NAME:
    default: "credit-risk-jobs"
    description: "CDE resource name for uploading job files"
  NEXT_PUBLIC_API_URL:
    default: ""
    description: "Backend API URL for frontend (auto-configured if empty, or set manually)"
    required: false

runtimes:
  - editor: Workbench
    kernel: Python 3.10
    edition: Standard

tasks:
  - type: run_session
    name: Install Dependencies
    script: 0_setup/install_dependencies.py
    short_summary: Install all required packages
    cpu: 2
    memory: 4

  - type: run_session
    name: Create Database Tables
    script: 0_setup/create_tables.py
    short_summary: Create SQLite database tables
    cpu: 1
    memory: 2

  - type: run_session
    name: Setup Vector Store
    script: 0_setup/setup_vector_store.py
    short_summary: Initialize ChromaDB vector store
    cpu: 1
    memory: 2

  - type: run_session
    name: Load Policy Documents
    script: 0_setup/load_policy_docs.py
    short_summary: Load policy documents into vector store
    cpu: 2
    memory: 4

  - type: run_session
    name: Generate Synthetic Data
    script: 1_data/generate_synthetic.py
    short_summary: Generate synthetic corporate loan data
    cpu: 2
    memory: 4

  - type: run_session
    name: Load Data to Database
    script: 1_data/load_data.py
    short_summary: Load generated data into database (SQLite or Iceberg)
    cpu: 2
    memory: 4

  - type: run_session
    name: Feature Engineering
    script: 2_features/feature_pipeline.py
    short_summary: Generate features for ML models (local or CDE mode)
    long_summary: |
      Creates engineered features for PD and LGD models.
      Supports two modes controlled by DATA_STORAGE_MODE environment variable:
      - local (default): Uses SQLite database
      - cde/iceberg: Triggers CDE Spark job for Iceberg tables
    cpu: 2
    memory: 4

  - type: run_session
    name: Train PD Model
    script: 3_models/train_pd_model.py
    short_summary: Train Probability of Default model
    cpu: 4
    memory: 8

  - type: run_session
    name: Train LGD Model
    script: 3_models/train_lgd_model.py
    short_summary: Train Loss Given Default model
    cpu: 4
    memory: 8

  - type: run_session
    name: Validate Models
    script: 3_models/validate_models.py
    short_summary: Run model validation tests
    cpu: 2
    memory: 4

  - type: create_model
    name: PD Model Endpoint
    entity_label: pd_model
    description: Probability of Default prediction endpoint
    short_summary: Deploy PD model as REST API
    script: 4_endpoints/cml_serve_pd.py
    function: predict
    default_resources:
      cpu: 2
      memory: 4
    default_replication_policy:
      type: fixed
      num_replicas: 1

  - type: create_model
    name: LGD Model Endpoint
    entity_label: lgd_model
    description: Loss Given Default prediction endpoint
    short_summary: Deploy LGD model as REST API
    script: 4_endpoints/cml_serve_lgd.py
    function: predict
    default_resources:
      cpu: 2
      memory: 4
    default_replication_policy:
      type: fixed
      num_replicas: 1

  - type: create_model
    name: RAG Query Endpoint
    entity_label: rag_query
    description: RAG-based policy query endpoint
    short_summary: Deploy RAG query as REST API
    script: 4_endpoints/serve_rag.py
    function: query
    default_resources:
      cpu: 2
      memory: 4
    default_replication_policy:
      type: fixed
      num_replicas: 1

  - type: create_model
    name: Regulatory Capital Model Endpoint
    entity_label: regulatory_capital_model
    description: Basel IRB regulatory capital calculation endpoint
    short_summary: Deploy regulatory capital model as REST API
    script: 4_endpoints/cml_serve_regulatory_capital.py
    function: predict
    default_resources:
      cpu: 2
      memory: 4
    default_replication_policy:
      type: fixed
      num_replicas: 1

  - type: create_model
    name: VaR Model Endpoint
    entity_label: var_model
    description: Value at Risk Monte Carlo simulation endpoint
    short_summary: Deploy VaR model as REST API
    script: 4_endpoints/cml_serve_var.py
    function: predict
    default_resources:
      cpu: 2
      memory: 4
    default_replication_policy:
      type: fixed
      num_replicas: 1

  - type: run_session
    name: Build and Deploy Models
    script: 0_setup/build_models.py
    short_summary: Build and deploy model endpoints
    long_summary: Triggers model builds with proper file paths and deploys them as REST APIs
    cpu: 1
    memory: 2

  - type: start_application
    name: Credit Risk API
    subdomain: credit-api
    script: 5_backend/start.sh
    short_summary: Start FastAPI backend server
    long_summary: Backend API server with workflow, applications, and analyst endpoints
    cpu: 2
    memory: 4
    environment_variables:
      PORT: 8000

  - type: run_session
    name: Configure Frontend
    script: 0_setup/configure_frontend.py
    short_summary: Configure frontend API endpoints
    long_summary: Sets up frontend environment variables to connect to backend API (runs after backend is deployed)
    cpu: 1
    memory: 2

  - type: start_application
    name: Credit Risk Frontend
    subdomain: credit-app
    script: 6_frontend/start.sh
    short_summary: Start Next.js frontend
    long_summary: React frontend with workflow visualization and AI analyst
    cpu: 1
    memory: 2
    environment_variables:
      NODE_ENV: production

  - type: run_session
    name: Create CML Jobs
    script: 0_setup/create_jobs.py
    short_summary: Create training and monitoring jobs
    long_summary: Creates manual training jobs and scheduled monitoring/retraining jobs
    cpu: 1
    memory: 2

  - type: run_session
    name: Deploy CDE Jobs
    script: 0_setup/deploy_cde.py
    short_summary: Deploy Spark jobs to CDE (if configured)
    long_summary: Deploys feature engineering and batch scoring jobs to CDE when Iceberg mode is enabled
    cpu: 1
    memory: 2
